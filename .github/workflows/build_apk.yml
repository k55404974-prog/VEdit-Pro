name: Build VEdit Pro APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract VEdit Pro source ZIP
        run: |
          rm -rf project
          mkdir -p project
          unzip -o VEditPro_Android_100Percent_Final.zip -d project

      - name: Find Flutter project
        run: |
          if [ -f project/pubspec.yaml ]; then
            echo "PROJECT_DIR=project" >> "$GITHUB_ENV"
          else
            DIR=$(find project -name pubspec.yaml -type f -print -quit | xargs dirname)
            echo "PROJECT_DIR=$DIR" >> "$GITHUB_ENV"
          fi

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
         flutter-version: 3.35.7
         cache: true

      - name: Generate Android wrapper
        working-directory: ${{ env.PROJECT_DIR }}
        run: flutter create --platforms=android --no-pub .

      - name: Remove generated test
        working-directory: ${{ env.PROJECT_DIR }}
        run: rm -rf test

      - name: Fix Dart type and Android minSdk
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          sed -i 's/clamp(1000, double.infinity)/clamp(1000.0, double.infinity)/g' lib/main.dart
          sed -i 's#android:style/Theme.Light.NoActionBar#android:style/Theme.Material.Light.NoActionBar#g' android/app/src/main/res/values/styles.xml
          sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 24/g' android/app/build.gradle
          sed -i 's/minSdkVersion flutter.minSdkVersion/minSdkVersion 24/g' android/app/build.gradle
      - name: Set Java and Kotlin to 17
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("android/app/build.gradle")
          s = p.read_text()

          s = s.replace("JavaVersion.VERSION_1_8", "JavaVersion.VERSION_17")
          s = s.replace("jvmTarget = '1.8'", "jvmTarget = '17'")
          s = s.replace('jvmTarget = "1.8"', 'jvmTarget = "17"')

          # Remove any Java --release setting
          lines = s.splitlines()
          lines = [line for line in lines if "options.release" not in line]
          s = "\n".join(lines) + "\n"

          # Ensure Android Java compatibility is Java 17
          if "compileOptions {" in s:
              s = s.replace(
                  "compileOptions {",
                  "compileOptions {\n"
                  "        sourceCompatibility JavaVersion.VERSION_17\n"
                  "        targetCompatibility JavaVersion.VERSION_17",
                  1
              )
          else:
              s = s.replace(
                  "android {",
                  "android {\n"
                  "    compileOptions {\n"
                  "        sourceCompatibility JavaVersion.VERSION_17\n"
                  "        targetCompatibility JavaVersion.VERSION_17\n"
                  "    }",
                  1
              )

          s += """
          tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
              kotlinOptions.jvmTarget = "17"
          }
          """

          p.write_text(s)
          PY
      - name: Disable Android new DSL
        working-directory: ${{ env.PROJECT_DIR }}
        run: echo "android.newDsl=false" >> android/gradle.properties
      - name: Remove generated test
        working-directory: ${{ env.PROJECT_DIR }}
        run: rm -rf test

      - name: Fix Dart type and Android minSdk
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("lib/main.dart")
          s = p.read_text()
          s = s.replace(
              "clamp(1000, double.infinity)",
              "clamp(1000.0, double.infinity)"
          )
          p.write_text(s)

          p = Path("android/app/build.gradle")
          if p.exists():
              s = p.read_text()
              s = s.replace(
                  "minSdk = flutter.minSdkVersion",
                  "minSdk = 24"
              )
              s = s.replace(
                  "minSdkVersion flutter.minSdkVersion",
                  "minSdkVersion 24"
              )
              p.write_text(s)
          PY

      - name: Get dependencies
        working-directory: ${{ env.PROJECT_DIR }}
        run: flutter pub get

      - name: Analyze
        working-directory: ${{ env.PROJECT_DIR }}
        run: flutter analyze lib || true

      - name: Build release APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: flutter build apk --release --target-platform android-arm64

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: vedit-pro-release-apk
          path: ${{ env.PROJECT_DIR }}/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
